name: Compilar APK

on:
  push:
    branches: [main]
    # Una etiqueta tipo v0.1.0 también publica el APK en "Releases"
    # (ahí se descarga sin iniciar sesión en GitHub).
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK (debug)
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: XpandPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Pruebas unitarias (lógica de activar/restaurar)
        run: gradle :app:testDebugUnitTest --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XpandPro-debug-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
